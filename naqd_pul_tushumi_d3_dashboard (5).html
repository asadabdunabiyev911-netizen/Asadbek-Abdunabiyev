
<h2 class="sr-only">Naqd pul tushumi bo'yicha interaktiv D3 dashboard — 2024–2026 yillar I-chorak taqqoslash</h2>

<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: var(--font-sans); }

  #controls {
    display: flex; flex-wrap: wrap; gap: 10px;
    padding: 1rem 0 1.25rem;
  }
  .filter-btn {
    font-size: 12px; font-weight: 500;
    padding: 5px 14px; border-radius: 20px;
    border: 0.5px solid var(--color-border-secondary);
    background: var(--color-background-primary);
    color: var(--color-text-secondary);
    cursor: pointer; transition: all 0.18s;
  }
  .filter-btn.active {
    background: #3266ad; color: #fff; border-color: #3266ad;
  }
  .filter-btn:hover:not(.active) {
    background: var(--color-background-secondary);
    color: var(--color-text-primary);
  }

  #metric-cards {
    display: grid;
    grid-template-columns: repeat(3, minmax(0, 1fr));
    gap: 10px;
    margin-bottom: 1.5rem;
  }
  .mcard {
    background: var(--color-background-secondary);
    border-radius: var(--border-radius-md);
    padding: 0.85rem 1rem;
  }
  .mcard-label { font-size: 11px; color: var(--color-text-secondary); margin-bottom: 4px; }
  .mcard-val { font-size: 22px; font-weight: 500; color: var(--color-text-primary); }
  .mcard-delta { font-size: 11px; margin-top: 3px; }
  .pos { color: #1d9e75; } .neg { color: #e24b4a; }

  #chart-area { width: 100%; position: relative; }
  #tooltip {
    position: absolute; pointer-events: none;
    background: var(--color-background-primary);
    border: 0.5px solid var(--color-border-secondary);
    border-radius: var(--border-radius-md);
    padding: 10px 14px; font-size: 12px;
    color: var(--color-text-primary);
    box-shadow: 0 2px 8px rgba(0,0,0,0.10);
    opacity: 0; transition: opacity 0.15s;
    min-width: 170px; z-index: 10;
  }
  .tt-title { font-weight: 500; margin-bottom: 6px; font-size: 13px; }
  .tt-row { display: flex; justify-content: space-between; gap: 16px; margin-top: 3px; }
  .tt-dot { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 5px; }

  #legend {
    display: flex; gap: 18px; flex-wrap: wrap;
    font-size: 12px; color: var(--color-text-secondary);
    margin-top: 0.75rem;
  }
  .leg-item { display: flex; align-items: center; gap: 5px; cursor: pointer; user-select: none; }
  .leg-swatch { width: 10px; height: 10px; border-radius: 2px; }
  .leg-item.dim .leg-swatch { opacity: 0.25; }
  .leg-item.dim span { opacity: 0.35; }

  #view-toggle {
    display: flex; gap: 6px; margin-bottom: 1rem;
  }
  .vtbtn {
    font-size: 11px; padding: 4px 12px;
    border-radius: 14px;
    border: 0.5px solid var(--color-border-secondary);
    background: transparent;
    color: var(--color-text-secondary);
    cursor: pointer;
  }
  .vtbtn.active {
    background: var(--color-background-secondary);
    color: var(--color-text-primary);
    border-color: var(--color-border-primary);
  }

  #line-area { display: none; width: 100%; position: relative; }
</style>

<div id="controls">
  <button class="filter-btn active" data-cat="all">Barchasi</button>
  <button class="filter-btn" data-cat="Tovarlar">Tovarlar</button>
  <button class="filter-btn" data-cat="Xizmatlar">Xizmatlar</button>
  <button class="filter-btn" data-cat="Ustav">Ustav kapital</button>
  <button class="filter-btn" data-cat="Bank">Bank</button>
  <button class="filter-btn" data-cat="Boshqa">Boshqa</button>
</div>

<div id="metric-cards"></div>

<div id="view-toggle">
  <button class="vtbtn active" id="vt-bar">Grouped bar</button>
  <button class="vtbtn" id="vt-stacked">Stacked bar</button>
  <button class="vtbtn" id="vt-line">Trend chiziq</button>
</div>

<div id="chart-area">
  <svg id="main-svg" style="width:100%; display:block;"></svg>
  <div id="tooltip"></div>
</div>

<div id="legend"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
<script>
const RAW = [
  { cat: "Tovarlar",  y2024: 4820, y2025: 5430, y2026: 6210 },
  { cat: "Xizmatlar", y2024: 1950, y2025: 2340, y2026: 2870 },
  { cat: "Ustav",     y2024: 800,  y2025: 950,  y2026: 1100 },
  { cat: "Bank",      y2024: 620,  y2025: 710,  y2026: 830  },
  { cat: "Boshqa",    y2024: 410,  y2025: 390,  y2026: 460  },
];

const YEARS  = ["2024 I-ch.", "2025 I-ch.", "2026 I-ch."];
const KEYS   = ["y2024","y2025","y2026"];
const COLORS = { "Tovarlar":"#3266ad","Xizmatlar":"#1d9e75","Ustav":"#ba7517","Bank":"#a32d2d","Boshqa":"#534ab7" };
const YEAR_COLORS = ["#3266ad","#1d9e75","#ba7517"];

let activeFilter = "all";
let viewMode = "grouped";
let hiddenSeries = new Set();

function filtered() {
  return activeFilter === "all" ? RAW : RAW.filter(d => d.cat === activeFilter);
}

function fmt(n) { return n.toLocaleString(); }
function pct(a,b) { return b===0 ? "—" : ((b-a)/a*100).toFixed(1); }

function renderMetrics() {
  const data = filtered();
  const totals = KEYS.map(k => d3.sum(data, d => d[k]));
  const cards = document.getElementById("metric-cards");
  cards.innerHTML = YEARS.map((yr, i) => {
    const delta = i === 0 ? null : pct(totals[i-1], totals[i]);
    const clr = delta === null ? "" : (+delta >= 0 ? "pos" : "neg");
    const arrow = delta === null ? "" : (+delta >= 0 ? "▲" : "▼");
    return `<div class="mcard">
      <div class="mcard-label">${yr}</div>
      <div class="mcard-val">${fmt(totals[i])}</div>
      ${delta !== null ? `<div class="mcard-delta ${clr}">${arrow} ${Math.abs(+delta)}%</div>` : ""}
    </div>`;
  }).join("");
}

function renderLegend() {
  const data = filtered();
  const leg = document.getElementById("legend");
  if (viewMode === "line") {
    leg.innerHTML = YEARS.map((yr,i) => `
      <span class="leg-item" data-series="${i}">
        <span class="leg-swatch" style="background:${YEAR_COLORS[i]};"></span>
        <span>${yr}</span>
      </span>`).join("");
  } else {
    const cats = data.map(d => d.cat);
    leg.innerHTML = cats.map(c => `
      <span class="leg-item ${hiddenSeries.has(c)?'dim':''}" data-series="${c}">
        <span class="leg-swatch" style="background:${COLORS[c]};"></span>
        <span>${c}</span>
      </span>`).join("");
    leg.querySelectorAll(".leg-item").forEach(el => {
      el.addEventListener("click", () => {
        const s = el.dataset.series;
        if (hiddenSeries.has(s)) hiddenSeries.delete(s); else hiddenSeries.add(s);
        render();
      });
    });
  }
}

function getHeight() {
  return window.innerWidth < 500 ? 280 : 340;
}

function renderBar(stacked) {
  const data = filtered().filter(d => !hiddenSeries.has(d.cat));
  const svg = d3.select("#main-svg");
  svg.selectAll("*").remove();
  const H = getHeight(), margin = {top:18, right:12, bottom:36, left:52};
  const W = document.getElementById("chart-area").clientWidth || 600;
  const iW = W - margin.left - margin.right;
  const iH = H - margin.top - margin.bottom;
  svg.attr("viewBox", `0 0 ${W} ${H}`).attr("height", H);
  const g = svg.append("g").attr("transform", `translate(${margin.left},${margin.top})`);

  const xOuter = d3.scaleBand().domain(YEARS).range([0,iW]).padding(0.2);
  const xInner = d3.scaleBand().domain(data.map(d=>d.cat)).range([0,xOuter.bandwidth()]).padding(0.08);

  let yMax;
  if (stacked) {
    yMax = d3.max(YEARS, (_,i) => d3.sum(data, d => d[KEYS[i]]));
  } else {
    yMax = d3.max(data, d => Math.max(d.y2024,d.y2025,d.y2026));
  }
  const y = d3.scaleLinear().domain([0, yMax*1.1]).range([iH,0]).nice();

  g.append("g").attr("transform",`translate(0,${iH})`).call(
    d3.axisBottom(xOuter).tickSize(0)
  ).select(".domain").remove();
  g.selectAll(".tick text").style("font-size","12px").attr("dy","1.2em").style("fill","var(--color-text-secondary)");

  g.append("g").call(
    d3.axisLeft(y).ticks(5).tickFormat(d => d>=1000 ? d/1000+"k" : d).tickSize(-iW)
  ).call(ax => {
    ax.select(".domain").remove();
    ax.selectAll("line").attr("stroke","var(--color-border-tertiary)");
    ax.selectAll("text").style("font-size","11px").style("fill","var(--color-text-secondary)");
  });

  const tooltip = document.getElementById("tooltip");
  const chartArea = document.getElementById("chart-area");

  if (stacked) {
    const stack = d3.stack().keys(KEYS)(
      YEARS.map((_,i) => {
        const obj = { year: i };
        data.forEach(d => { obj[d.cat] = d[KEYS[i]]; });
        return obj;
      })
    );
    const stackData = YEARS.map((_,i) => {
      const obj = { year: i, yearLabel: YEARS[i] };
      data.forEach(d => { obj[d.cat] = d[KEYS[i]]; });
      return obj;
    });
    const stackGen = d3.stack().keys(data.map(d=>d.cat))(stackData);
    stackGen.forEach(layer => {
      g.selectAll(null).data(layer).join("rect")
        .attr("x", (_,i) => xOuter(YEARS[i]))
        .attr("y", d => y(d[1]))
        .attr("height", d => Math.max(0, y(d[0])-y(d[1])))
        .attr("width", xOuter.bandwidth())
        .attr("fill", COLORS[layer.key])
        .attr("rx", 2)
        .on("mousemove", function(event, d) {
          const yr = d.data.yearLabel;
          const rows = data.map(cat => `<div class="tt-row"><span><span class="tt-dot" style="background:${COLORS[cat.cat]};"></span>${cat.cat}</span><span>${fmt(d.data[cat.cat])}</span></div>`).join("");
          tooltip.innerHTML = `<div class="tt-title">${yr}</div>${rows}`;
          tooltip.style.opacity = 1;
          posTooltip(event);
        })
        .on("mouseleave", () => tooltip.style.opacity = 0);
    });
  } else {
    YEARS.forEach((yr, yi) => {
      g.selectAll(null).data(data).join("rect")
        .attr("x", d => xOuter(yr) + xInner(d.cat))
        .attr("y", d => y(d[KEYS[yi]]))
        .attr("height", d => iH - y(d[KEYS[yi]]))
        .attr("width", xInner.bandwidth())
        .attr("fill", d => COLORS[d.cat])
        .attr("rx", 2)
        .attr("opacity", d => hiddenSeries.has(d.cat) ? 0.15 : 0.85)
        .on("mousemove", function(event, d) {
          tooltip.innerHTML = `<div class="tt-title">${d.cat} — ${yr}</div>
            <div class="tt-row"><span>Qiymat</span><span>${fmt(d[KEYS[yi]])}</span></div>
            <div class="tt-row"><span>2024→2026</span><span class="${+pct(d.y2024,d.y2026)>=0?'pos':'neg'}">${pct(d.y2024,d.y2026)}%</span></div>`;
          tooltip.style.opacity = 1;
          posTooltip(event);
        })
        .on("mouseleave", () => tooltip.style.opacity = 0);
    });
  }

  function posTooltip(e) {
    const rect = chartArea.getBoundingClientRect();
    const ex = e.clientX - rect.left, ey = e.clientY - rect.top;
    const tw = 190;
    tooltip.style.left = (ex + 12 + tw > rect.width ? ex - tw - 10 : ex + 12) + "px";
    tooltip.style.top = Math.max(0, ey - 30) + "px";
  }
}

function renderLine() {
  const data = filtered();
  const svg = d3.select("#main-svg");
  svg.selectAll("*").remove();
  const H = getHeight(), margin = {top:18, right:20, bottom:36, left:52};
  const W = document.getElementById("chart-area").clientWidth || 600;
  const iW = W - margin.left - margin.right;
  const iH = H - margin.top - margin.bottom;
  svg.attr("viewBox", `0 0 ${W} ${H}`).attr("height", H);
  const g = svg.append("g").attr("transform", `translate(${margin.left},${margin.top})`);

  const x = d3.scalePoint().domain(data.map(d=>d.cat)).range([0,iW]).padding(0.3);
  const yMax = d3.max(KEYS, k => d3.max(data, d => d[k]));
  const y = d3.scaleLinear().domain([0, yMax*1.1]).range([iH,0]).nice();

  g.append("g").attr("transform",`translate(0,${iH})`).call(
    d3.axisBottom(x).tickSize(0)
  ).select(".domain").remove();
  g.selectAll(".tick text").style("font-size","11px").attr("dy","1.2em").style("fill","var(--color-text-secondary)");
  g.append("g").call(
    d3.axisLeft(y).ticks(5).tickFormat(d => d>=1000 ? d/1000+"k" : d).tickSize(-iW)
  ).call(ax => {
    ax.select(".domain").remove();
    ax.selectAll("line").attr("stroke","var(--color-border-tertiary)");
    ax.selectAll("text").style("font-size","11px").style("fill","var(--color-text-secondary)");
  });

  const line = d3.line().x(d => x(d.cat)).y(d => y(d.val)).curve(d3.curveMonotoneX);
  const tooltip = document.getElementById("tooltip");
  const chartArea = document.getElementById("chart-area");

  KEYS.forEach((k,i) => {
    const pts = data.map(d => ({ cat: d.cat, val: d[k] }));
    g.append("path").datum(pts).attr("fill","none")
      .attr("stroke", YEAR_COLORS[i]).attr("stroke-width", 2.5)
      .attr("stroke-dasharray", i===1 ? "6,3" : i===2 ? "2,3" : "none")
      .attr("d", line);
    g.selectAll(null).data(pts).join("circle")
      .attr("cx", d => x(d.cat)).attr("cy", d => y(d.val))
      .attr("r", 5).attr("fill", YEAR_COLORS[i]).attr("stroke","var(--color-background-primary)").attr("stroke-width",2)
      .on("mousemove", function(event, d) {
        tooltip.innerHTML = `<div class="tt-title">${d.cat}</div>
          <div class="tt-row"><span>${YEARS[i]}</span><span>${fmt(d.val)}</span></div>`;
        tooltip.style.opacity = 1;
        const rect = chartArea.getBoundingClientRect();
        const ex = event.clientX - rect.left, ey = event.clientY - rect.top;
        tooltip.style.left = (ex + 14) + "px";
        tooltip.style.top = Math.max(0, ey - 30) + "px";
      })
      .on("mouseleave", () => tooltip.style.opacity = 0);
  });
}

function render() {
  renderMetrics();
  renderLegend();
  if (viewMode === "grouped") renderBar(false);
  else if (viewMode === "stacked") renderBar(true);
  else renderLine();
}

document.querySelectorAll(".filter-btn").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    activeFilter = btn.dataset.cat;
    hiddenSeries.clear();
    render();
  });
});

document.getElementById("vt-bar").addEventListener("click", () => {
  viewMode = "grouped";
  document.querySelectorAll(".vtbtn").forEach(b=>b.classList.remove("active"));
  document.getElementById("vt-bar").classList.add("active");
  render();
});
document.getElementById("vt-stacked").addEventListener("click", () => {
  viewMode = "stacked";
  document.querySelectorAll(".vtbtn").forEach(b=>b.classList.remove("active"));
  document.getElementById("vt-stacked").classList.add("active");
  render();
});
document.getElementById("vt-line").addEventListener("click", () => {
  viewMode = "line";
  document.querySelectorAll(".vtbtn").forEach(b=>b.classList.remove("active"));
  document.getElementById("vt-line").classList.add("active");
  render();
});

render();
window.addEventListener("resize", () => render());
</script>
